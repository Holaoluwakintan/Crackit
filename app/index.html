<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>%TITLE%</title>
<meta name="description" content="%DESC%" />
<meta name="theme-color" content="%THEME%" />
<meta property="og:title" content="%TITLE%" />
<meta property="og:description" content="%DESC%" />
<meta property="og:type" content="website" />
<meta property="og:image" content="https://crackit-ng.vercel.app/og.png" />
<meta property="og:url" content="https://crackit-ng.vercel.app/" />
<meta property="og:site_name" content="CrackIt" />
<link rel="canonical" href="https://crackit-ng.vercel.app/" />
<meta name="twitter:card" content="summary_large_image" />
<script>try{var t=localStorage.getItem("crackit:theme")||"auto";document.documentElement.dataset.theme=(t==="dark"||(t==="auto"&&matchMedia("(prefers-color-scheme: dark)").matches))?"dark":"light"}catch(e){}</script>
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="icon" href="/icons/icon-192.png" type="image/png" />
<link rel="apple-touch-icon" href="/icons/icon-192.png" />
<style>html{background:#f6f8f7}html[data-theme=dark]{background:#0a120e}.boot{display:flex;flex-direction:column;align-items:center;gap:12px;padding-top:38vh;font:800 18px system-ui,sans-serif;color:#0b5d3b}html[data-theme=dark] .boot{color:#45d08f}.boot-logo{width:56px;height:56px;border-radius:16px;background:#0b5d3b;box-shadow:0 10px 24px -10px rgba(11,93,59,.8);animation:bp 1.2s ease-in-out infinite}@keyframes bp{50%{transform:scale(.92)}}@media(prefers-reduced-motion:reduce){.boot-logo{animation:none}}</style>
</head>
<body>
<div id="app"><div class="boot"><div class="boot-logo"></div><b>%NAME%</b></div></div>

<script type="module" src="/src/main.tsx"></script>
</body>
</html>
